<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MMORPG 재화 획득·소비와 강화 성장 비용을 유저 유형별로 검증하는 경제 시뮬레이터">
  <title>MMORPG 재화 순환·강화 경제 시뮬레이터</title>
  <style>
    :root{--bg:#0b1220;--panel:#172235;--panel2:#101a2b;--line:#2b3a50;--text:#edf3fb;--muted:#93a4bb;--gold:#f3b51b;--green:#35d399;--red:#fb7185;--blue:#60a5fa;--purple:#c084fc;--orange:#fb923c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1260px;margin:auto;padding:0 22px}.top{position:sticky;top:0;z-index:20;background:#111c2e;border-bottom:1px solid var(--line);box-shadow:0 6px 24px #0004}.topin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:20px;font-weight:900}.brand b{color:var(--gold)}.tabs{display:flex;gap:6px;overflow:auto}.tab{color:var(--muted);background:transparent;border:1px solid transparent;border-radius:9px;padding:10px 14px;font-weight:800;white-space:nowrap}.tab.active{background:#25334a;color:var(--gold);border-color:#53627a}.hero,.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #0002}.hero{padding:22px;margin:24px 0}.hero h1{font-size:18px;margin:0 0 6px;color:var(--green)}.hero p{margin:0;color:var(--muted)}.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.goal{padding:13px;background:#0d1727;border:1px solid var(--line);border-radius:11px}.goal b{display:block;margin-bottom:3px}.goal span{color:var(--muted);font-size:12px}.view{display:none;padding-bottom:48px}.view.active{display:block}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{padding:18px}.card h2{margin:0 0 14px;font-size:17px}.sub{color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field select,.cell{width:100%;background:#0c1626;color:var(--text);border:1px solid #40516a;border-radius:8px;padding:9px}.field input:focus,.field select:focus,.cell:focus{outline:2px solid #f3b51b55;border-color:var(--gold)}.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rangehead{display:flex;justify-content:space-between;font-weight:800}.range{width:100%;accent-color:var(--green)}.kpi{padding:16px;background:#0c1626;border:1px solid var(--line);border-radius:12px}.kpi small{display:block;color:var(--muted);font-weight:800;margin-bottom:7px}.kpi strong{font-size:23px;display:block}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.purple{color:var(--purple)}table{width:100%;border-collapse:collapse;min-width:720px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}th{background:#0b1423;color:var(--muted);font-size:12px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}.cell{padding:6px;text-align:right}.note{padding:11px 13px;background:#0b1423;border-left:3px solid var(--blue);border-radius:7px;color:var(--muted);font-size:12px}.diag{padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#0c1626;margin:8px 0}.diag.warn{border-color:#7c4a28;color:#fdba74}.diag.bad{border-color:#7f3343;color:#fda4af}.diag.good{border-color:#23634f;color:#6ee7b7}.barrow{display:grid;grid-template-columns:90px 1fr 120px;gap:10px;align-items:center;margin:10px 0}.bar{height:10px;background:#26364d;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:20px}.gradebar{display:flex;gap:6px;flex-wrap:wrap}.grade{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#0c1626;color:var(--muted);font-weight:800}.grade.active{border-color:var(--purple);color:var(--purple);background:#2a1740}.footer{text-align:center;color:#65758d;padding:25px;border-top:1px solid #17243a}@media(max-width:900px){.topin{align-items:flex-start;flex-direction:column;padding:14px 0}.g2,.g3,.g4,.goals{grid-template-columns:1fr}.wrap{padding:0 14px}.barrow{grid-template-columns:75px 1fr}.barrow strong{grid-column:2}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap topin"><div class="brand">MMORPG <b>재화 순환·강화 경제 시뮬레이터</b></div><nav class="tabs"><button class="tab active" data-tab="setup">1. 시스템 설정</button><button class="tab" data-tab="economy">2. 재화 순환</button><button class="tab" data-tab="progression">3. 목표 성장 경로</button></nav></div></header>
  <main class="wrap"><section class="hero"><h1>시뮬레이션 검증 목표</h1><p>유저의 플레이 시간과 콘텐츠 선택이 재화 순환과 목표 강화 기간에 미치는 영향을 검증합니다.</p><div class="goals"><div class="goal"><b>Source–Sink 균형</b><span>획득량·회수량·순발행량 확인</span></div><div class="goal"><b>누적 강화 비용</b><span>+1부터 목표 단계까지 평균·P90 계산</span></div><div class="goal"><b>유저 유형별 성장 격차</b><span>라이트·코어·헤비 결과 비교</span></div></div></section><section id="setup" class="view active"></section><section id="economy" class="view"></section><section id="progression" class="view"></section></main>
  <footer class="footer">이복희 · Senior Game System Designer · 공개용 샘플 데이터 사용</footer>
<script>
const grades=[{name:'일반',mult:1,key:'normal'},{name:'고급',mult:1.2,key:'advanced'},{name:'희귀',mult:1.5,key:'highest'},{name:'영웅',mult:2,key:'heroic'},{name:'전설',mult:3,key:'legend'}];
const profiles=[{name:'라이트',hours:2,quest:70,fixed:.65,growth:.35,trade:.5},{name:'코어',hours:4,quest:80,fixed:1,growth:1,trade:1},{name:'헤비',hours:8,quest:90,fixed:1.35,growth:1.6,trade:1.5}];
const state={tab:'setup',mods:{gold:0,drop:0,discount:0},ecoModel:'시장',tradeFee:5,tradeParticipation:30,stoneDropAmount:1.5,main:{gold:5000,mult:1.1,stone:2,time:5},dungeons:[{name:'일반',limit:10,time:3,gold:5000,rates:{normal:80,advanced:15,highest:5,heroic:0,legend:0}},{name:'어려움',limit:5,time:5,gold:15000,rates:{normal:20,advanced:50,highest:25,heroic:5,legend:0}},{name:'레이드',limit:3,time:10,gold:40000,rates:{normal:0,advanced:10,highest:40,heroic:40,legend:10}}],enhance:Array.from({length:10},(_,i)=>({level:i+1,gold:Math.round(1000*Math.pow(1.85,i)/100)*100,stone:[1,2,3,5,8,12,18,26,38,55][i],prob:i<3?100:Math.max(5,100-(i-2)*10)})),scenario:{hours:4,quest:80,dungeon:0,fixed:60000,growth:160000,initialGold:100000,initialStone:10},equip:0,target:8};
const fmt=n=>Number.isFinite(n)?Math.round(n).toLocaleString():'달성 불가';
const pct=(arr,p)=>arr[Math.min(arr.length-1,Math.floor((arr.length-1)*p))];
function enhanceProjection(){const g=grades[state.equip],disc=1-state.mods.discount/100,rows=state.enhance.slice(0,state.target).map(r=>{const cg=Math.max(0,Math.round(r.gold*g.mult*disc)),cs=Math.max(0,r.stone*g.mult*disc),tries=1/Math.max(.0001,r.prob/100);return{...r,cg,cs,tries,eg:cg*tries,es:cs*tries}});const expectedGold=rows.reduce((a,r)=>a+r.eg,0),expectedStone=rows.reduce((a,r)=>a+r.es,0),expectedTries=rows.reduce((a,r)=>a+r.tries,0);let seed=82417;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);const sims=[];for(let s=0;s<4000;s++){let gold=0,stone=0,tries=0;rows.forEach(r=>{const p=Math.max(.0001,r.prob/100),n=p>=1?1:Math.ceil(Math.log(1-rnd())/Math.log(1-p));gold+=n*r.cg;stone+=n*r.cs;tries+=n});sims.push({gold,stone,tries})}const gs=sims.map(x=>x.gold).sort((a,b)=>a-b),ss=sims.map(x=>x.stone).sort((a,b)=>a-b);const key=g.key;const reqs=state.dungeons.map(d=>{const stoneRun=(d.rates[key]/100)*state.stoneDropAmount*(1+state.mods.drop/100),goldRun=d.gold*(1+state.mods.gold/100),runsStone=stoneRun>0?Math.ceil(expectedStone/stoneRun):Infinity,runsGold=goldRun>0?Math.ceil(expectedGold/goldRun):Infinity,runs=Math.max(runsStone,runsGold);return{...d,stoneRun,runs,days:Number.isFinite(runs)?Math.ceil(runs/d.limit):Infinity,minutes:Number.isFinite(runs)?runs*d.time:Infinity}});return{rows,expectedGold,expectedStone,expectedTries,p50Gold:pct(gs,.5),p90Gold:pct(gs,.9),p50Stone:pct(ss,.5),p90Stone:pct(ss,.9),reqs}}
function calcEconomy(hours,questRatio,fixedScale=1,growthScale=1,tradeScale=1){const d=state.dungeons[state.scenario.dungeon],mins=hours*60,dmins=Math.min(mins,d.limit*d.time),druns=Math.floor(dmins/d.time),remaining=Math.max(0,mins-dmins),qruns=Math.floor(remaining*(questRatio/100)/Math.max(1,state.main.time)),dGold=druns*d.gold*(1+state.mods.gold/100),qGold=qruns*state.main.gold*state.main.mult*(1+state.mods.gold/100),faucet=dGold+qGold,participation=Math.min(100,state.tradeParticipation*tradeScale),tax=state.ecoModel==='폐쇄'?0:faucet*(participation/100)*(state.tradeFee/100),fixed=state.scenario.fixed*fixedScale,growth=state.scenario.growth*growthScale,plannedSink=fixed+growth+tax,ratio=plannedSink?faucet/plannedSink:0,stoneDay=druns*(d.rates[grades[state.equip].key]/100)*state.stoneDropAmount*(1+state.mods.drop/100)+qruns*state.main.stone;let gold=state.scenario.initialGold,blocked=0;const timeline=[];for(let day=1;day<=365;day++){gold+=faucet;const fixedSpend=Math.min(gold,fixed+tax);gold-=fixedSpend;const growthSpend=Math.min(gold,growth);gold-=growthSpend;if(growthSpend<growth)blocked++;timeline.push(gold)}const ep=enhanceProjection(),availableGold=Math.max(0,faucet-fixed-tax),needGold=Math.max(0,ep.expectedGold-state.scenario.initialGold),needStone=Math.max(0,ep.expectedStone-state.scenario.initialStone),goldDays=needGold===0?0:availableGold>0?Math.ceil(needGold/availableGold):Infinity,stoneDays=needStone===0?0:stoneDay>0?Math.ceil(needStone/stoneDay):Infinity,goalDays=Math.max(goldDays,stoneDays);return{hours,questRatio,druns,dmins,remaining,qruns,dGold,qGold,faucet,tax,fixed,growth,plannedSink,ratio,stoneDay,timeline,blocked,goalDays,net:faucet-plannedSink,participation}}
function diagnostics(m){const list=[];if(m.ratio>1.2)list.push(['bad','순발행 위험: Source가 Sink보다 20% 이상 큽니다. 장기 통화량이 빠르게 증가할 수 있습니다.']);else if(m.ratio<.8)list.push(['warn','성장 정체 위험: 계획 Sink가 Source보다 큽니다. 선택 소비가 중단될 수 있습니다.']);else list.push(['good','현재 설정은 Source와 계획 Sink가 균형 구간에 가깝습니다.']);if(m.blocked>0)list.push(['warn',`지급 능력 경고: 365일 중 ${m.blocked}일은 계획한 성장 소비를 전부 실행할 수 없습니다.`]);const eff=state.dungeons.map(d=>d.gold/Math.max(1,d.time)),gap=Math.max(...eff)/Math.max(1,Math.min(...eff));if(gap>2)list.push(['warn',`콘텐츠 편중: 최고·최저 던전의 시간당 골드 효율 차이가 ${gap.toFixed(1)}배입니다.`]);if(state.ecoModel!=='폐쇄'&&state.tradeParticipation===30)list.push(['good','거래 참여율 30%는 샘플 가정입니다. 라이브 데이터에 맞춰 조정할 수 있습니다.']);return list}
function input(label,path,value,type='number',extra=''){return`<div class="field"><label>${label}</label><input type="${type}" data-path="${path}" value="${value}" ${extra}></div>`}
function renderSetup(){return`<div class="grid g2"><div class="card"><h2>글로벌 밸런스 제어</h2>${[['골드 획득 부스트','mods.gold',state.mods.gold,'gold'],['강화석 드롭 부스트','mods.drop',state.mods.drop,'green'],['강화 비용 할인','mods.discount',state.mods.discount,'red']].map(x=>`<div class="field"><div class="rangehead"><label>${x[0]}</label><b class="${x[3]}">${x[1].includes('discount')?'-':'+'}${x[2]}%</b></div><input class="range" type="range" min="0" max="${x[1].includes('discount')?50:100}" step="5" data-path="${x[1]}" value="${x[2]}"></div>`).join('')}<div class="note">모든 탭의 Source, Sink, 목표 강화 비용에 즉시 반영됩니다.</div></div><div class="card"><h2>경제 가정 공개</h2><div class="inline"><div class="field"><label>경제 모델</label><select data-path="ecoModel"><option ${state.ecoModel==='폐쇄'?'selected':''}>폐쇄</option><option ${state.ecoModel==='시장'?'selected':''}>시장</option></select></div>${input('거래소 수수료 (%)','tradeFee',state.tradeFee)}</div><div class="inline">${input('거래 참여율 (%)','tradeParticipation',state.tradeParticipation)}${input('드롭 성공 시 평균 수량','stoneDropAmount',state.stoneDropAmount,'number','step="0.1"')}</div><div class="note">거래 참여율과 강화석 기대 수량을 계산식 안에 숨기지 않고 설계 변수로 공개합니다.</div></div></div><div class="card" style="margin-top:16px"><h2>던전 Source 테이블</h2><div class="tablewrap"><table><thead><tr><th>던전</th><th>일일 제한</th><th>시간</th><th>골드</th>${grades.map(g=>`<th>${g.name}(%)</th>`).join('')}</tr></thead><tbody>${state.dungeons.map((d,i)=>`<tr><td>${d.name}</td><td><input class="cell" data-path="dungeons.${i}.limit" value="${d.limit}" type="number"></td><td><input class="cell" data-path="dungeons.${i}.time" value="${d.time}" type="number"></td><td><input class="cell" data-path="dungeons.${i}.gold" value="${d.gold}" type="number"></td>${grades.map(g=>`<td><input class="cell" data-path="dungeons.${i}.rates.${g.key}" value="${d.rates[g.key]}" type="number"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2>메인 퀘스트</h2><div class="inline">${input('1회 골드','main.gold',state.main.gold)}${input('보상 계수','main.mult',state.main.mult,'number','step="0.1"')}${input('강화석 수량','main.stone',state.main.stone)}${input('소요 시간(분)','main.time',state.main.time)}</div></div><div class="card"><h2>현재 적용 공식</h2><p class="note">일일 Source = 던전 보상 + 잔여 시간 퀘스트 보상</p><p class="note">거래세 Sink = Source × 거래 참여율 × 수수료율</p><p class="note">강화 누적 비용 = Σ(단계별 비용 ÷ 성공확률)</p></div></div><div class="card" style="margin-top:16px"><h2>강화 단계 테이블</h2><div class="tablewrap"><table><thead><tr><th>단계</th><th>1회 골드</th><th>1회 강화석</th><th>성공률(%)</th></tr></thead><tbody>${state.enhance.map((r,i)=>`<tr><td>+${r.level}</td><td><input class="cell" data-path="enhance.${i}.gold" type="number" value="${r.gold}"></td><td><input class="cell" data-path="enhance.${i}.stone" type="number" value="${r.stone}"></td><td><input class="cell" data-path="enhance.${i}.prob" type="number" value="${r.prob}"></td></tr>`).join('')}</tbody></table></div></div>`}
function renderEconomy(){const s=state.scenario,m=calcEconomy(s.hours,s.quest),max=Math.max(m.faucet,m.plannedSink,1),ps=profiles.map(p=>({p,m:calcEconomy(p.hours,p.quest,p.fixed,p.growth,p.trade)}));return`<div class="grid g3"><div class="card"><h2>대표 유저 시나리오</h2><div class="inline"><div class="field"><label>하루 플레이 시간</label><select data-path="scenario.hours"><option value="2" ${s.hours===2?'selected':''}>2시간</option><option value="4" ${s.hours===4?'selected':''}>4시간</option><option value="8" ${s.hours===8?'selected':''}>8시간</option></select></div><div class="field"><label>주력 던전</label><select data-path="scenario.dungeon">${state.dungeons.map((d,i)=>`<option value="${i}" ${s.dungeon===i?'selected':''}>${d.name}</option>`).join('')}</select></div></div>${input('잔여시간 퀘스트 비율 (%)','scenario.quest',s.quest)}<div class="inline">${input('초기 보유 골드','scenario.initialGold',s.initialGold)}${input('초기 보유 강화석','scenario.initialStone',s.initialStone)}</div></div><div class="card"><h2>계획된 일일 Sink</h2>${input('고정 Sink','scenario.fixed',s.fixed)}${input('성장 Sink 상한','scenario.growth',s.growth)}<div class="note">보유 재화보다 많은 소비는 실행되지 않으며 부족한 날은 성장 소비 중단으로 기록합니다.</div></div><div class="card"><h2>Source ÷ Sink 비율</h2><div class="kpi"><small>계획 소비 기준</small><strong class="${m.ratio>1.2?'red':m.ratio<.8?'blue':'green'}">${m.ratio.toFixed(2)}</strong></div><div class="barrow"><span>Source</span><div class="bar"><i style="width:${m.faucet/max*100}%"></i></div><strong class="green">+${fmt(m.faucet)} G</strong></div><div class="barrow"><span>Sink</span><div class="bar"><i style="width:${m.plannedSink/max*100}%;background:linear-gradient(90deg,var(--orange),var(--red))"></i></div><strong class="red">-${fmt(m.plannedSink)} G</strong></div></div></div><div class="grid g4" style="margin-top:16px"><div class="kpi"><small>일일 순발행</small><strong class="${m.net>=0?'green':'red'}">${m.net>=0?'+':''}${fmt(m.net)} G</strong></div><div class="kpi"><small>30일 보유 잔고</small><strong>${fmt(m.timeline[29])} G</strong></div><div class="kpi"><small>성장 소비 중단</small><strong class="${m.blocked?'red':'green'}">${m.blocked}일</strong></div><div class="kpi"><small>평균 목표 강화</small><strong class="purple">${fmt(m.goalDays)}일</strong></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2>자동 진단</h2>${diagnostics(m).map(d=>`<div class="diag ${d[0]}">${d[1]}</div>`).join('')}</div><div class="card"><h2>장기 보유 재화</h2>${[[30,m.timeline[29]],[90,m.timeline[89]],[365,m.timeline[364]]].map(x=>`<div class="barrow"><span>${x[0]}일</span><div class="bar"><i style="width:${Math.min(100,x[1]/Math.max(1,state.scenario.initialGold+m.faucet*30)*100)}%"></i></div><strong>${fmt(x[1])} G</strong></div>`).join('')}<p class="sub">재화 부족 시 계획된 성장 소비를 자동 중단한 결과입니다.</p></div></div><div class="card" style="margin-top:16px"><h2>유저 유형별 성장 격차</h2><div class="tablewrap"><table><thead><tr><th>유형</th><th>플레이</th><th>일일 Source</th><th>계획 Sink</th><th>순발행</th><th>목표 강화</th><th>소비 중단일</th></tr></thead><tbody>${ps.map(({p,m})=>`<tr><td><b>${p.name}</b></td><td>${p.hours}시간</td><td class="green">+${fmt(m.faucet)}</td><td class="red">-${fmt(m.plannedSink)}</td><td class="${m.net>=0?'green':'red'}">${m.net>=0?'+':''}${fmt(m.net)}</td><td class="purple">${fmt(m.goalDays)}일</td><td>${m.blocked}일</td></tr>`).join('')}</tbody></table></div></div>`}
function renderProgression(){const e=enhanceProjection(),g=grades[state.equip];return`<div class="grid g2"><div class="card"><h2>장비와 목표 설정</h2><div class="field"><label>장비 등급</label><div class="gradebar">${grades.map((x,i)=>`<button class="grade ${i===state.equip?'active':''}" data-equip="${i}">${x.name}</button>`).join('')}</div></div><div class="field"><div class="rangehead"><label>목표 강화 단계</label><b class="green">+${state.target}</b></div><input class="range" data-path="target" type="range" min="1" max="10" value="${state.target}"></div><div class="note">+1부터 +${state.target}까지 모든 단계의 비용과 실패 횟수를 누적합니다.</div></div><div class="card"><h2>목표 달성 비용 분포</h2><div class="grid g3"><div class="kpi"><small>평균 비용</small><strong class="gold">${fmt(e.expectedGold)} G</strong><span class="purple">${fmt(e.expectedStone)} S</span></div><div class="kpi"><small>P50 비용</small><strong>${fmt(e.p50Gold)} G</strong><span>${fmt(e.p50Stone)} S</span></div><div class="kpi"><small>P90 비용</small><strong class="red">${fmt(e.p90Gold)} G</strong><span class="red">${fmt(e.p90Stone)} S</span></div></div><p class="sub">고정 성공률·실패 시 단계 유지 조건으로 4,000회 재현한 분포입니다. P90은 유저 90%가 그 이하에서 달성하는 비용입니다.</p></div></div><div class="card" style="margin-top:16px"><h2>던전별 파밍 요구치</h2><div class="grid g3">${e.reqs.map(d=>`<div class="kpi"><small>${d.name} 던전 · 일 ${d.limit}회</small><strong class="${Number.isFinite(d.runs)?'blue':'red'}">${Number.isFinite(d.runs)?fmt(d.runs)+'회':'드롭 불가'}</strong><div>${Number.isFinite(d.days)?fmt(d.days)+'일 · '+fmt(d.minutes)+'분':'해당 등급 강화석 미드롭'}</div><span class="sub">1회 기대 강화석 ${d.stoneRun.toFixed(2)}개</span></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><h2>${g.name} 장비 +${state.target} 누적 성장 경로</h2><div class="tablewrap"><table><thead><tr><th>단계</th><th>성공률</th><th>평균 시도</th><th>1회 골드</th><th>단계 평균 골드</th><th>단계 평균 강화석</th></tr></thead><tbody>${e.rows.map(r=>`<tr><td>+${r.level}</td><td>${r.prob}%</td><td>${r.tries.toFixed(2)}회</td><td>${fmt(r.cg)}</td><td class="gold">${fmt(r.eg)}</td><td class="purple">${r.es.toFixed(1)}</td></tr>`).join('')}<tr><td><b>누적</b></td><td>-</td><td><b>${e.expectedTries.toFixed(2)}회</b></td><td>-</td><td class="gold"><b>${fmt(e.expectedGold)} G</b></td><td class="purple"><b>${e.expectedStone.toFixed(1)} S</b></td></tr></tbody></table></div></div>`}
function setPath(path,val){const keys=path.split('.');let obj=state;keys.slice(0,-1).forEach(k=>obj=obj[isNaN(k)?k:Number(k)]);const key=keys.at(-1),old=obj[key];obj[key]=typeof old==='number'?Number(val):val}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===state.tab));document.getElementById('setup').innerHTML=renderSetup();document.getElementById('economy').innerHTML=renderEconomy();document.getElementById('progression').innerHTML=renderProgression()}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]'),grade=e.target.closest('[data-equip]');if(tab){state.tab=tab.dataset.tab;render()}if(grade){state.equip=Number(grade.dataset.equip);render()}});
document.addEventListener('change',e=>{if(!e.target.dataset.path)return;setPath(e.target.dataset.path,e.target.value);render()});
let renderTimer;document.addEventListener('input',e=>{if(!e.target.dataset.path)return;setPath(e.target.dataset.path,e.target.value);clearTimeout(renderTimer);renderTimer=setTimeout(render,180)});
render();
</script>
</body>
</html>
