                                            <div className="flex justify-between items-center text-slate-300 pt-2">
                                                <span className="text-xs">총 소비량 (Sink)</span> 
                                                <span className="text-rose-400 font-black">-{macroStats.totalConsumption.toLocaleString()}</span>
                                            </div>
                                        </div>
                                    </DashboardCard>
                                </div>

                                <DashboardCard title="장기 누적 지표 (1개월, 3개월, 1년 추적)" icon="bar-chart">
                                    <div className="h-72 w-full mb-6">
                                        <LongTermChart timeline={macroStats.timeline} />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">30일 누적 자산 잔고</p>
                                            <p className={`text-xl font-black ${macroStats.timeline[29] > 0 ? 'text-mmo-primary' : 'text-rose-500'}`}>{macroStats.timeline[29].toLocaleString()} G</p>
                                        </div>
                                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">90일 누적 (시즌1 종료)</p>
                                            <p className={`text-xl font-black ${macroStats.timeline[89] > 0 ? 'text-mmo-primary' : 'text-rose-500'}`}>{macroStats.timeline[89].toLocaleString()} G</p>
                                        </div>
                                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">365일 누적 (1주년)</p>
                                            <p className={`text-xl font-black ${macroStats.timeline[364] > 0 ? 'text-mmo-primary' : 'text-rose-500'}`}>{macroStats.timeline[364].toLocaleString()} G</p>
                                        </div>
                                    </div>
                                </DashboardCard>
                            </div>
                        )}

                        {/* ======================= Tab 3 ======================= */}
                        {activeTab === 'vsm' && (
                            <div className="animate-fade-in space-y-6">
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    
                                    <aside className="lg:col-span-4 space-y-6">
                                        <DashboardCard title="강화 장비 세팅 및 비용 연동" icon="crosshair">
                                            <div className="space-y-4">
                                                
                                                {/* 1. 장비 등급 및 목표 레벨 세팅 */}
                                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-600 shadow-inner">
                                                    <h4 className="text-sm font-black text-slate-100 mb-4 uppercase tracking-wider flex items-center gap-2"><i data-lucide="shield" className="w-4 h-4 text-emerald-400"></i> 장비 및 목표 셋업</h4>
                                                    
                                                    <div className="space-y-4">
                                                        <div>
                                                            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">장비 등급 선택 (강화 비용 배수 적용)</label>
                                                            <div className="grid grid-cols-5 gap-1">
                                                                {EQUIP_GRADES.map((grade, idx) => (
                                                                    <button 
                                                                        key={idx} 
                                                                        onClick={() => setSelectedEquipGrade(idx)}
                                                                        className={`py-2 text-[11px] font-bold rounded border transition-colors ${selectedEquipGrade === idx ? `bg-slate-700 ${grade.color} border-${grade.color.split('-')[1]}-500 shadow-inner` : 'bg-slate-900 text-slate-500 border-slate-700 hover:bg-slate-800'}`}
                                                                    >
                                                                        {grade.name}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <div className="flex justify-between items-center mb-2">
                                                                <label className="text-[10px] font-bold text-slate-500 uppercase">도전 강화 레벨 (1~10강)</label>
                                                                <span className="text-sm font-black text-emerald-400">+{targetLevel} 강 도전</span>
                                                            </div>
                                                            <input type="range" min="1" max="10" value={targetLevel} onChange={e=>setTargetLevel(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
                                                            <div className="flex justify-between text-[9px] text-slate-500 mt-1 px-1"><span>1</span><span>5</span><span>10</span></div>
                                                        </div>

                                                        <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2 relative overflow-hidden">
                                                            {globalMods.enhanceDiscount > 0 && <div className="absolute top-1 right-1 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded animate-pulse">할인 적용됨</div>}
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-xs font-bold text-slate-400">1회 시도 비용 (G)</span>
                                                                <span className="text-sm font-bold text-mmo-primary">{vsmData.costG.toLocaleString()} G</span>
                                                            </div>
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-xs font-bold text-slate-400">필요 강화석 ({STONE_GRADES[targetStoneGrade].name})</span>
                                                                <span className={`text-sm font-bold ${STONE_GRADES[targetStoneGrade].color}`}>{vsmData.costS.toLocaleString()} 개</span>
                                                            </div>
                                                            <div className="flex justify-between items-center border-t border-slate-700 pt-2 mt-2">
                                                                <span className="text-xs font-bold text-slate-300">적용 성공 확률</span>
                                                                <span className={`text-lg font-black ${vsmData.prob === 100 ? 'text-blue-400' : (vsmData.prob > 50 ? 'text-emerald-400' : 'text-rose-400')}`}>{vsmData.prob}%</span>
                                                            </div>
                                                        </div>
                                                        <p className="text-[10px] text-slate-500 leading-tight">* 비용 및 확률은 1번 탭의 설정을 기반으로 하며, 글로벌 할인율이 모두 곱해져 자동 연산됩니다.</p>
                                                    </div>
                                                </div>

                                            </div>
                                        </DashboardCard>
                                    </aside>

                                    <main className="lg:col-span-8 space-y-6">
                                        <DashboardCard title="VSM (Value Stream Map): 던전별 필요 파밍 횟수 비교" icon="git-merge">
                                            
                                            <div className="p-4 mb-6 rounded-xl border border-slate-600 bg-slate-800 shadow-inner flex flex-col md:flex-row items-center justify-between gap-4">
                                                <div>
                                                    <div className="text-xs font-black uppercase tracking-widest mb-1 text-slate-400">목표 강화 달성 비용 요약</div>
                                                    <div className="text-lg font-bold text-slate-200">
                                                        <span className={EQUIP_GRADES[selectedEquipGrade].color}>{EQUIP_GRADES[selectedEquipGrade].name} 장비</span> 
                                                        <i data-lucide="arrow-right" className="w-4 h-4 inline mx-2"></i>
                                                        <span className="text-emerald-400">+{targetLevel}강 성공 기댓값</span>
                                                    </div>
                                                </div>
                                                <div className="flex gap-4 text-right">
                                                    <div>
                                                        <div className="text-[10px] text-slate-400 mb-1">총 필요 골드 (실패 포함)</div>
                                                        <div className="text-xl font-black text-mmo-primary">{vsmData.reqTotalGold.toLocaleString()} G</div>
                                                    </div>
                                                    <div>
                                                        <div className="text-[10px] text-slate-400 mb-1">총 필요 강화석 (실패 포함)</div>
                                                        <div className={`text-xl font-black ${STONE_GRADES[targetStoneGrade].color}`}>{vsmData.reqTotalStone.toLocaleString()} S</div>
                                                    </div>
                                                </div>
                                            </div>

                                            <h4 className="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><i data-lucide="swords" className="w-4 h-4"></i> 던전 등급별 파밍 요구치 (Source)</h4>
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                                {vsmData.dungeonReqs.map((d, i) => (
                                                    <div 
                                                        key={i} 
                                                        onClick={() => { if (d.reqRuns !== Infinity) setDungeonGradeFocus(i); }}
                                                        className={`p-4 rounded-xl border-2 relative overflow-hidden transition-all ${d.reqRuns !== Infinity ? 'cursor-pointer' : 'opacity-70'} ${dungeonGradeFocus === i ? 'bg-slate-800 border-emerald-500 shadow-lg shadow-emerald-500/20' : 'bg-slate-900/50 border-slate-700 hover:border-slate-500 hover:bg-slate-800'}`}
                                                    >
                                                        {dungeonGradeFocus === i && <div className="absolute top-0 right-0 bg-emerald-500 text-slate-900 text-[10px] font-black px-2 py-1 rounded-bl-lg">선택됨</div>}
                                                        
                                                        <div className="flex justify-between items-center mb-2">
                                                            <div className="font-bold text-slate-200">{d.grade} 던전</div>
                                                            <div className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400">일일 {d.dailyLimit}회 제한</div>
                                                        </div>
                                                        
                                                        <div className="py-3 text-center border-y border-slate-700 my-2">
                                                            {d.reqRuns === Infinity ? (
                                                                <div className="text-xl font-black text-rose-500 py-1">드랍 불가</div>
                                                            ) : (
                                                                <>
                                                                    <div className="text-3xl font-black text-slate-100">{d.reqRuns}<span className="text-sm font-normal text-slate-400 ml-1">회</span></div>
                                                                    <div className="text-xs text-emerald-400 font-bold mt-1">총 {d.runTimeTotal}분 소요</div>
                                                                </>
                                                            )}
                                                        </div>
                                                        
                                                        <div className="text-center text-xs">
                                                            {d.reqRuns === Infinity ? (
                                                                <span className="text-rose-400">해당 등급 강화석 미드랍</span>
                                                            ) : (
                                                                <span className={d.daysNeeded > 1 ? 'text-orange-400 font-bold' : 'text-slate-400'}>
                                                                    일일 제한 고려시: {d.daysNeeded} 일 소요
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="flex items-center justify-center gap-4 mb-6">
                                                <i data-lucide="arrow-down" className="text-slate-600 w-6 h-6 animate-bounce"></i>
                                            </div>

                                            {/* 스플릿 컨테이너 (Value vs Waste) */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="p-4 bg-emerald-900/20 border border-emerald-500/30 rounded-xl flex items-center justify-between shadow-md">
                                                    <div>
                                                        <div className="text-xs font-black uppercase text-emerald-400 mb-1 flex items-center gap-1"><i data-lucide="check-circle-2" className="w-4 h-4"></i> 가치 창출 (성공)</div>
                                                        <div className="text-[10px] text-slate-400">단 1회의 성공에 쓰인 재화</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-sm font-bold text-slate-200">-{vsmData.successGold.toLocaleString()} G</div>
                                                        <div className="text-xs text-slate-400">-{vsmData.successStone.toLocaleString()} S</div>
                                                    </div>
                                                </div>
                                                
                                                <div className="p-4 bg-rose-900/20 border border-rose-500/40 rounded-xl flex items-center justify-between shadow-md relative overflow-hidden">
                                                    {vsmData.wasteGold > 0 && <div className="absolute top-0 right-0 w-8 h-8 bg-rose-500/20 rounded-bl-full flex items-start justify-end p-1"><span className="animate-ping absolute h-2 w-2 rounded-full bg-rose-400 opacity-75"></span></div>}
                                                    <div>
                                                        <div className="text-xs font-black uppercase text-rose-400 mb-1 flex items-center gap-1"><i data-lucide="flame" className="w-4 h-4"></i> 낭비 (실패로 증발)</div>
                                                        <div className="text-[10px] text-rose-400/80">({(vsmData.expectedTries - 1).toFixed(1)}회 실패 기댓값)</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-sm font-bold text-rose-300">-{vsmData.wasteGold.toLocaleString()} G</div>
                                                        <div className="text-xs text-rose-400">-{vsmData.wasteStone.toLocaleString()} S</div>
                                                    </div>
                                                </div>
                                            </div>

                                        </DashboardCard>
                                    </main>

                                    {/* 일일 콘텐츠 활동 에디터 테이블 */}
                                    <div className="lg:col-span-12">
                                        <DashboardCard title="일일 콘텐츠 활동 (Daily Content Activity) 에디터" icon="table">
                                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                                                <p className="text-xs text-slate-400">
                                                    이 테이블은 <b>유저가 하루에 겪는 획득/소모 흐름</b>을 직접 조작하며 실험하는 공간입니다. <span className="text-emerald-400 font-bold">실행 횟수</span>를 마음껏 조작하여 최종 순수익을 확인해 보세요.<br/>
                                                    <span className="text-rose-400 text-[10px]">* 우측 버튼을 누르면 수동 조작 내역이 초기화되고, 상단 VSM 시뮬레이션 결과값으로 덮어씌워집니다.</span>
                                                </p>
                                                <button onClick={syncTableWithVsm} className="shrink-0 bg-slate-700 hover:bg-rose-600 text-slate-200 text-xs font-bold py-2 px-4 rounded-lg shadow-lg flex items-center gap-2 transition-colors border border-slate-600 hover:border-rose-500">
                                                    <i data-lucide="rotate-ccw" className="w-4 h-4"></i> VSM 계산값으로 초기화 (덮어쓰기)
                                                </button>
                                            </div>
                                            <div className="overflow-x-auto rounded-xl border border-slate-700">
                                                <table className="w-full text-sm text-center border-collapse">
                                                    <thead className="bg-slate-900 border-b border-slate-700 text-slate-400 text-xs">
                                                        <tr>
                                                            <th className="py-3 px-2 border-r border-slate-700 w-16 font-bold">유형</th>
                                                            <th className="py-3 px-2 border-r border-slate-700 text-left font-bold">활동명 (콘텐츠/싱크)</th>
                                                            <th className="py-3 px-2 border-r border-slate-700 w-24 font-bold text-emerald-400 bg-emerald-900/20">실행 횟수</th>
                                                            <th className="py-3 px-2 border-r border-slate-700 w-24 font-bold">1회 기준 골드</th>
                                                            <th className="py-3 px-2 border-r border-slate-700 w-24 font-bold">1회 기준 강화석</th>
                                                            <th className="py-3 px-2 border-r border-slate-700 w-20 font-bold">1회 소요 시간</th>
                                                            <th className="py-3 px-4 font-black text-mmo-primary bg-slate-800 text-right">해당 행 총계 (Total)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-700/50 bg-slate-800/50">
                                                        {vsmActivities.map(act => (
                                                            <tr key={act.id} className="hover:bg-slate-800 transition-colors">
                                                                <td className="py-2 px-2 border-r border-slate-700">
                                                                    {act.type === 'source' ? <span className="bg-blue-900/50 text-blue-400 px-2 py-1 rounded text-[10px] font-bold">생산</span> : 
                                                                    <span className="bg-orange-900/50 text-orange-400 px-2 py-1 rounded text-[10px] font-bold">소비</span>}
                                                                </td>
                                                                <td className="py-2 px-2 border-r border-slate-700 text-left font-bold text-slate-300">{act.name}</td>
                                                                <td className="py-2 px-2 border-r border-slate-700 bg-emerald-900/10"><input type="number" value={act.count} onChange={e=>handleVsmChange(act.id, 'count', e.target.value)} className="w-full bg-slate-900 border border-emerald-500/50 rounded p-1.5 text-center text-sm font-black text-emerald-400 focus:border-emerald-400 focus:outline-none shadow-inner" /></td>
                                                                <td className="py-2 px-2 border-r border-slate-700"><input type="number" value={act.gold} onChange={e=>handleVsmChange(act.id, 'gold', e.target.value)} className={`w-full bg-slate-900 border border-slate-600 rounded p-1.5 text-right text-xs font-bold focus:border-mmo-primary focus:outline-none ${act.type==='source'?'text-blue-400':'text-orange-400'}`} /></td>
                                                                <td className="py-2 px-2 border-r border-slate-700"><input type="number" value={act.stone} onChange={e=>handleVsmChange(act.id, 'stone', e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded p-1.5 text-right text-xs text-slate-200 focus:border-purple-400 focus:outline-none" /></td>
                                                                <td className="py-2 px-2 border-r border-slate-700"><input type="number" value={act.time} onChange={e=>handleVsmChange(act.id, 'time', e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded p-1.5 text-center text-xs text-slate-200 focus:border-mmo-primary focus:outline-none" /></td>
                                                                <td className="py-2 px-4 text-right bg-slate-800/80">
                                                                    <div className={`text-sm font-black ${act.type==='source'?'text-blue-400':'text-rose-400'}`}>{(act.count * act.gold).toLocaleString()} <span className="text-[10px] font-normal">G</span></div>
                                                                    <div className={`text-xs font-bold ${act.type==='source'?'text-purple-400':'text-rose-400/80'}`}>{(act.count * act.stone).toFixed(1)} <span className="text-[10px] font-normal">S</span></div>
                                                                    <div className="text-[10px] text-slate-400 font-bold mt-0.5">{(act.count * act.time).toLocaleString()} 분</div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        
                                                        {/* --- 총 생산 요약 --- */}
                                                        <tr className="bg-blue-900/20 text-blue-400 border-t-2 border-blue-500/30">
                                                            <td colSpan="6" className="py-3 px-4 border-r border-slate-700 text-right text-xs font-bold uppercase tracking-wider">총 생산 (Total Production)</td>
                                                            <td className="py-3 px-4 text-right font-black">
                                                                <div>+{vsmTableStats.prod.gold.toLocaleString()} G</div>
                                                                <div className="text-purple-400 text-xs">+{vsmTableStats.prod.stone.toFixed(1)} S</div>
                                                                <div className="text-slate-400 text-[10px] mt-0.5">{vsmTableStats.prod.time.toLocaleString()} 분</div>
                                                            </td>
                                                        </tr>
                                                        
                                                        {/* --- 총 소비 요약 --- */}
                                                        <tr className="bg-orange-900/20 text-orange-400 border-b-2 border-orange-500/30">
                                                            <td colSpan="6" className="py-3 px-4 border-r border-slate-700 text-right text-xs font-bold uppercase tracking-wider">총 소비 (Total Consumption)</td>
                                                            <td className="py-3 px-4 text-right font-black">
                                                                <div>-{vsmTableStats.cons.gold.toLocaleString()} G</div>
                                                                <div className="text-rose-400 text-xs">-{vsmTableStats.cons.stone.toFixed(1)} S</div>
                                                                <div className="text-slate-400 text-[10px] mt-0.5">{vsmTableStats.cons.time.toLocaleString()} 분</div>
                                                            </td>
                                                        </tr>
                                                        
                                                        {/* --- 최종 순수익 --- */}
                                                        <tr className="bg-slate-900 font-black text-lg">
                                                            <td colSpan="6" className="py-5 px-4 border-r border-slate-700 text-right text-slate-200 uppercase tracking-widest">최종 일일 순수익 (Net Balance)</td>
                                                            <td className="py-5 px-4 text-right">
                                                                <div className={`${vsmTableStats.prod.gold >= vsmTableStats.cons.gold ? 'text-emerald-400' : 'text-rose-500'}`}>
                                                                    {vsmTableStats.prod.gold >= vsmTableStats.cons.gold ? '+' : ''}{(vsmTableStats.prod.gold - vsmTableStats.cons.gold).toLocaleString()} G
                                                                </div>
                                                                <div className={`text-sm mt-1 ${vsmTableStats.prod.stone >= vsmTableStats.cons.stone ? 'text-emerald-400' : 'text-rose-500'}`}>
                                                                    {vsmTableStats.prod.stone >= vsmTableStats.cons.stone ? '+' : ''}{(vsmTableStats.prod.stone - vsmTableStats.cons.stone).toFixed(1)} S
                                                                </div>
                                                                <div className="text-[11px] text-slate-400 font-bold mt-2">총 리드타임: {vsmTableStats.leadTime}분</div>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </DashboardCard>
                                    </div>
                                    {/* --------------------------------- */}

                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="mt-8 py-6 text-center text-slate-600 text-[10px] font-bold uppercase tracking-widest border-t border-slate-800">
                        MMORPG Economy Balance Simulator &bull; Enhanced with AI Studio VSM Logic
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
